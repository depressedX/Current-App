name: Current
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ONNXRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.24.2
targets:
  Current:
    type: application
    platform: iOS
    sources:
      - path: Current
        excludes: [Resources/Semantics]
      - path: Current/Resources/Semantics
        type: folder
        buildPhase: resources
    dependencies:
      - package: ONNXRuntime
        product: onnxruntime
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Current
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liupenghao.current
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
  CurrentCarPlay:
    type: application
    platform: iOS
    sources:
      - path: Current
        excludes: [Resources/Semantics]
      - path: Current/Resources/Semantics
        type: folder
        buildPhase: resources
    dependencies:
      - package: ONNXRuntime
        product: onnxruntime
    info:
      path: Config/CarPlay-Info.plist
      properties:
        CFBundleDisplayName: Current
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: Current CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liupenghao.current
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/CurrentCarPlay.entitlements
  CurrentTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/CurrentTests]
    dependencies:
      - target: Current
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liupenghao.current.tests
        GENERATE_INFOPLIST_FILE: YES
  CurrentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/CurrentUITests]
    dependencies:
      - target: Current
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liupenghao.current.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Current:
    build:
      targets:
        Current: all
    test:
      targets: [CurrentTests, CurrentUITests]
  CurrentCarPlay:
    build:
      targets:
        CurrentCarPlay: all
