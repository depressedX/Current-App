name: Current
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SwiftSRP:
    url: https://github.com/adam-fowler/swift-srp
    exactVersion: 2.4.0
  OpenAI:
    url: https://github.com/MacPaw/OpenAI
    exactVersion: 0.5.3
  ONNXRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.24.2
targets:
  Current:
    type: application
    platform: iOS
    sources:
      - path: Current
        excludes: [Resources/Semantics]
      - path: Current/Resources/Semantics
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftSRP
        product: SRP
      - package: OpenAI
        product: OpenAI
      - package: ONNXRuntime
        product: onnxruntime
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Current
        NSLocalNetworkUsageDescription: 连接你的 Mac，在电脑分析歌曲并同步结果。
        NSBonjourServices: [_current-an._tcp]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liupenghao.current
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
  CurrentCarPlay:
    type: application
    platform: iOS
    sources:
      - path: Current
        excludes: [Resources/Semantics]
      - path: Current/Resources/Semantics
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftSRP
        product: SRP
      - package: OpenAI
        product: OpenAI
      - package: ONNXRuntime
        product: onnxruntime
    info:
      path: Config/CarPlay-Info.plist
      properties:
        CFBundleDisplayName: Current
        NSLocalNetworkUsageDescription: 连接你的 Mac，在电脑分析歌曲并同步结果。
        NSBonjourServices: [_current-an._tcp]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: Current CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liupenghao.current
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/CurrentCarPlay.entitlements
  CurrentCompanion:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MacCompanion
      - path: Current/Companion
        excludes: [CompanionClient.swift]
      - path: Current/Analysis
        excludes: [SongPoolStore.swift]
      - path: Current/Core/Models.swift
      - path: Current/Core/RecommendationQuery.swift
      - path: Current/Core/NetEaseAPI.swift
      - path: Current/Core/NetEaseCrypto.swift
      - path: Current/Core/KeychainStore.swift
      - path: Current/Diagnostics/AppLog.swift
      - path: Current/Resources/Semantics
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftSRP
        product: SRP
      - package: ONNXRuntime
        product: onnxruntime
    info:
      path: Config/Companion-Info.plist
      properties:
        LSMultipleInstancesProhibited: YES
        CFBundleDisplayName: Current 分析伴侣
        NSLocalNetworkUsageDescription: 连接你的 iPhone，接收分析任务并同步结果。
        NSBonjourServices: [_current-an._tcp]
        LSApplicationCategoryType: public.app-category.music
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liupenghao.current.companion
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Config/CurrentCompanion.entitlements
  CurrentTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/CurrentTests]
    dependencies:
      - target: Current
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liupenghao.current.tests
        GENERATE_INFOPLIST_FILE: YES
  CurrentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/CurrentUITests]
    dependencies:
      - target: Current
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liupenghao.current.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Current:
    build:
      targets:
        Current: all
    test:
      targets: [CurrentTests, CurrentUITests]
  CurrentCarPlay:
    build:
      targets:
        CurrentCarPlay: all
  CurrentCompanion:
    build:
      targets:
        CurrentCompanion: all
